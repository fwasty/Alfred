<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <style>
      .k{font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; font-weight: 800;}
    </style>
  </defs>
  <rect width="1024" height="1024" fill="none"/>
  <!-- Magnifying glass (minimal) -->
  <circle cx="430" cy="430" r="250" fill="none" stroke="#0B0F19" stroke-width="64" stroke-linecap="round"/>
  <rect x="612" y="612" width="330" height="98" rx="49" fill="#0B0F19" transform="rotate(45 612 612)"/>
  <!-- GS monogram (clean typographic) -->
  <text x="430" y="500" text-anchor="middle" class="k" font-size="260" letter-spacing="-22" fill="#0B0F19">GS</text>
</svg>
