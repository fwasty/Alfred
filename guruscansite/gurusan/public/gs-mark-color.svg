<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <style>
      .k{font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; font-weight: 900;}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0B0F19" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="none"/>

  <!-- Colored magnifier -->
  <g filter="url(#shadow)">
    <circle cx="430" cy="430" r="250" fill="none" stroke="url(#grad)" stroke-width="72" stroke-linecap="round"/>
    <rect x="612" y="612" width="330" height="98" rx="49" fill="url(#grad)" transform="rotate(45 612 612)"/>

    <!-- subtle inner ring for depth -->
    <circle cx="430" cy="430" r="200" fill="none" stroke="#0B0F19" stroke-width="14" opacity="0.20"/>

    <!-- GS monogram -->
    <text x="430" y="508" text-anchor="middle" class="k" font-size="270" letter-spacing="-24" fill="#0B0F19">GS</text>
  </g>
</svg>
